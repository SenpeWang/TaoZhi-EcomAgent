guides:
  - doc_id: SYN_CORPUS_G_TROUBLE
    title: 充电与配件异常排查指引（评测资料）
    body: |
      充电与配件异常排查指引
      一、插上完全没反应
      按顺序排查：换线 → 换充电头 → 换插座或车充 → 换受电设备 → 仍无效走报修流程。
      二、充电功率低于标称
      ① 确认线材是否支持目标功率（LX-21 满功率 140W 须使用 C1 口并搭配 5A E-Marker 线材）；
      ② 确认受电设备支持的协议档位；③ 双口同充会降额（LX-20 双口同充时单口降为 45W）。
      三、充电器发热
      满载长时间使用，外壳温度不超过 60℃ 属正常范围；超过 60℃ 或出现异味、异响应立即停用并报修。
      四、磁吸线断连
      先清洁磁吸触点，再确认对位是否偏移，最后排查保护壳厚度是否影响吸附。
      五、报修
      提供订单号与设备 SN，售后在 48 小时内响应；无订单号时可用支付记录替代。
  - doc_id: SYN_CORPUS_G_EXCEPTION
    title: 售后例外条款（评测资料）
    body: |
      售后例外条款
      一、无理由退货
      签收后 7 天内、商品不影响二次销售的可无理由退货。
      二、超期退货
      签收后 7 至 15 天内，仅在存在质量原因时可退；超过 15 天仅提供维修服务。
      三、无发票
      发票遗失可用订单号或支付记录替代，不影响退货受理。
      四、已拆封
      拆封但商品不影响二次销售的可退；影响二次销售的，仅质量原因可退。
      五、赠品
      赠品须随主商品一并退回；赠品损坏或缺失按赠品价值折抵 39 元。
      六、人为损坏
      保修期内因人为损坏（跌落、进水、私自拆解）不在免费保修范围，可付费维修。
  - doc_id: SYN_CORPUS_G_CHOOSE
    title: 充电器选购指南（评测资料）
    body: |
      充电器选购指南
      一、给笔记本电脑用
      选 LX-21 140W；需使用 C1 口并搭配 5A E-Marker 线材才能满血 140W。
      二、给手机、平板用
      LX-20 65W 已足够，支持 PD 快充。
      三、差旅轻装
      LX-20 搭配 MC-500 磁吸线，一套覆盖手机与平板。
      四、多设备同时充电
      LX-21 三个 C 口，笔记本与手机可同时供电。
      五、不确定时
      先向客户确认设备型号与所需功率，不要凭印象推荐；不同机型协议档位不同。
  - doc_id: SYN_CORPUS_G_WARRANTY_V1
    title: 保修政策 V1.0（评测资料，2025-03-01 生效）
    body: |
      保修政策 V1.0
      生效日期：2025-03-01
      一、整机保修
      整机保修 12 个月，自签收之日起计算。
      二、配件保修
      配件保修 6 个月。
      三、凭证要求
      申请保修须提供发票原件，无发票不予受理。
  - doc_id: SYN_CORPUS_G_WARRANTY_V2
    title: 保修政策 V2.0（评测资料，2026-09-01 生效）
    body: |
      保修政策 V2.0
      生效日期：2026-09-01，本版生效后以本版为准，V1.0 同时废止。
      一、整机保修
      整机保修 18 个月，自签收之日起计算。
      二、配件保修
      配件保修 12 个月。
      三、凭证要求
      发票遗失可用订单号或支付记录替代。
  - doc_id: SYN_CORPUS_G_HANDBOOK
    title: 售后服务综合手册（评测资料）
    body: |
      售后服务综合手册
      一、受理范围
      受理整机与配件的退货、换货、维修三类诉求；超出受理范围的事项转投诉通道。
      二、退货运费
      质量问题导致的退货由商家承担运费；非质量问题由客户承担，运费 12 元从退款金额中扣除。
      三、换货时效
      收到客户寄回的商品后，48 小时内发出新商品。
      四、退款到账
      退款原路退回，1-3 个工作日到账；具体到账时间以支付渠道为准。
      五、退款时限
      客户签收后 7 天内可申请无理由退款；超过 7 天按《售后例外条款》处理。
      六、争议处理
      本手册与《售后例外条款》不一致时，以《售后例外条款》为准。
