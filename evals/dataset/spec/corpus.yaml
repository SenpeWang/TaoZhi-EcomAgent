# 检索层语料规格：产品 / 兼容关系 / 政策文档，含可判定的事实字段。
#
# 设计要点：
# 1. 语料随包进 git，seed.py 灌库后检索层即可在任意机器复现——
#    不再依赖 data/incoming 私有语料（那目录不进 git，换机解析率即崩塌）。
# 2. 每篇文档的 facts 是机器可判定的锚点：generate.py 用它渲染
#    expected_facts，judge 与规则层都能用，避免"答了但不知道答没答对"。
# 3. 文档 id 用 SYN_CORPUS_ 前缀，与权限夹具 SYN_DOC_ 同族，--clean 一并清除。
version: 1

