  - id: SYN_DOC_A_FIN_AI
    title: 平台货款结算周期与营销补贴分摊规则（L3 已授权 AI 摘要版）
    scope: company
    level: 3
    state: published
    node: COMPANY_ROOT
    ai_allowed: true
    body: |
      平台货款结算周期与营销补贴分摊规则（2026Q4 财务合规版，脱敏可 AI 分析）
      一、渠道结算账期
      1. 天猫旗舰店确认收货后标准结算周期为 T+7 个自然日。
      2. 抖音小店标准货款结算周期为 T+15 个自然日，且订单名下无未完结仲裁工单。
      3. 微信小程序商城微信支付直连结算周期为 T+3 个工作日。
      二、大促补贴分摊比例
      1. 平台跨店满减活动由平台与商家按 3:7 比例分摊补贴额。
      2. 店铺自建限时秒杀券由商家 100% 承担营销分摊。
      三、对账复核时限
      对账单异议须在账单出具后 10 个工作日内发起复核，逾期系统自动封账。

  - id: SYN_DOC_A_CS01
    title: 客服部二线疑难升级与关爱补贴审批口径（CS 部门内控）
    scope: org
    level: 2
    state: published
    node: SYN_NODE_CS
    ai_allowed: true
    body: |
      客服部二线疑难升级与关爱补贴审批口径（仅限客服组管理层查阅）
      一、二线升级时效
      疑难件由一线客服升级至二线专员后，首次介入响应时限为 30 分钟内。
      二、小额关爱补贴权限
      客服组长单笔关爱体验券或小额补偿审批上限为 50 元，超过 50 元须报运营总监会签。
      三、留痕要件
      所有破损赔付申请必须登记原工单号，并留存清晰开箱拆包视频凭证。

