    body: |
      平台佣金与账期规则（2026Q4 财务合规版，脱敏可 AI 分析）
      一、平台佣金率
      1. 天猫旗舰店佣金率 4.5%。
      2. 抖音小店佣金率 3%。
      3. 微信小程序商城佣金率 2%。
      二、结算账期
      1. 天猫旗舰店确认收货后 T+7 个自然日结算。
      2. 抖音小店确认收货后 T+15 个自然日结算。
      3. 微信小程序商城 T+3 个工作日结算。
      三、对账要求
      对账异议须在账单出具后 10 个工作日内发起复核，逾期系统自动封账。

