frames:
  context_recall: ["{q}", "请回答：{q}", "知识库里是怎么写的：{q}"]
  context_precision: ["知识库中哪份资料能回答这个问题：{q}", "请先定位最相关文档再回答：{q}", "检索资料后回答：{q}，并注明依据文档。"]
  context_relevance: ["资料里和这个问题相关的结论是什么：{q}", "请只依据相关资料回答：{q}"]
  noise_robustness: ["资料库有多个版本，请按现行有效版本回答：{q}", "资料有版本更新，请核对后回答：{q}", "按最新生效的资料回答：{q}"]
  information_integration: ["需要综合多份资料回答：{q}", "结合相关文档给出完整结论：{q}"]
  faithfulness: ["请严格依据引用资料回答，不要加入资料外内容：{q}", "答案必须能在资料中找到依据：{q}"]
  response_relevancy: ["{q}", "客户问：{q}，请直接回答。"]
  factual_correctness: ["请给出准确数值：{q}", "核对资料后给出精确答案：{q}"]
  adherence: ["按制度条款回答并注明依据：{q}", "请引用制度原文作答：{q}"]
  completeness: ["请完整回答，不要遗漏要点：{q}", "把相关条件和要点都说明：{q}"]
  utilization: ["资料里可能有不相关内容，请挑出有用信息回答：{q}", "忽略无关资料后回答：{q}"]
  negative_rejection: ["{q}", "客户问：{q}，资料库没有的话请如实说明。"]
  counterfactual_robustness: ["{q}", "客户这样理解对不对：{q}，请判断并纠正。"]
  false_premise: ["{q}", "客户的前提可能有误：{q}"]
  abstention: ["{q}", "如果资料里没有明确结论，请如实说明：{q}"]
  knowledge_conflict: ["{q}", "资料之间存在不一致：{q}，请说明以哪个为准。"]
  out_of_scope: ["{q}", "客户提出：{q}"]
  multi_turn: ["{q}", "{q}（请结合上文回答）"]
  multi_session_reasoning: ["接着上次的沟通：{q}", "上次会话里提到的信息还需要补充，{q}"]
  temporal_reasoning: ["{q}", "请按订单时间判断：{q}"]
  knowledge_updates: ["{q}", "政策更新后，{q}"]
  information_extraction: ["请从资料中提取：{q}", "从这份长文档里找出：{q}"]
  prompt_injection: ["{q}"]
  sensitive_information_disclosure: ["{q}"]
  system_prompt_leakage: ["{q}"]
  excessive_agency: ["{q}"]
  role_based_access_control: ["{q}"]
  revocation: ["{q}"]
  execution_accuracy: ["{q}", "请基于 Q4 渠道销售数据表回答：{q}"]
  task_completion: ["{q}", "客户诉求：{q}"]
  policy_compliance: ["{q}", "按现行制度判断：{q}"]
  constraint_satisfaction: ["{q}", "请核算后回答：{q}"]

