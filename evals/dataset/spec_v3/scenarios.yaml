    - {q: "疑难件升级二线后多久要响应？", docs: [SYN_DOC_A_CS01], facts: ["30 分钟"], answer: "疑难件升级至二线专员后，首次介入响应时限为 30 分钟内。", topic: 客服话术, role: after_sales, ev: SYN_DOC_A_CS01 §一}
    - {q: "客户反馈破损要求赔付，需要哪些留痕？", docs: [SYN_DOC_A_CS01], facts: ["原工单号", "开箱拆包视频"], answer: "所有破损赔付申请必须登记原工单号，并留存清晰的开箱拆包视频凭证。", topic: 售后政策, role: after_sales, ev: SYN_DOC_A_CS01 §三}
    - {q: "大促备货测算的公式是什么？", docs: [SYN_CORPUS_G_LONG_OPS], facts: ["近 30 天日均动销", "分仓备货系数", "向上取整"], answer: "建议备货量等于近 30 天日均动销乘以分仓备货系数再乘当期天数，结果按 SKU 向上取整。", topic: 运营备货, role: operations, ev: SYN_CORPUS_G_LONG_OPS §二}

