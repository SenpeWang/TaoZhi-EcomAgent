    - {q: "大促结束后价格怎么恢复？", docs: [SYN_CORPUS_G_CHANNEL, SYN_DOC_A_OPS02], facts: ["7 天", "不得以活动延续为由"], answer: "大促直降须在活动结束后 7 天内恢复限价，不得以活动延续为由继续低价。", topic: 渠道价格, role: operations, ev: SYN_CORPUS_G_CHANNEL §四}
    - {q: "客户要求事后补办保价，可以吗？", docs: [SYN_CORPUS_G_LOGISTICS], facts: ["下单时勾选", "事后不再补办"], answer: "保价须在下单时勾选并填写声明价值，事后不再补办。", topic: 物流时效, role: supply_chain, ev: SYN_CORPUS_G_LOGISTICS §三}
    - {q: "退货时赠品缺失怎么处理？", docs: [SYN_CORPUS_G_EXCEPTION], facts: ["39 元"], answer: "赠品须随主商品一并退回，缺失或损坏按赠品价值折抵 39 元。", topic: 售后政策, role: after_sales, ev: SYN_CORPUS_G_EXCEPTION §五}
    - {q: "客户要求红冲发票，操作流程是什么？", docs: [SYN_CORPUS_P_INVOICE], facts: ["30 日", "原发票号码", "红冲原因"], answer: "开具后 30 日内受理红冲，需提供原发票号码与红冲原因；原发票已抵扣的先由客户进项转出。", topic: 发票开票, role: finance, ev: SYN_CORPUS_P_INVOICE §四}
