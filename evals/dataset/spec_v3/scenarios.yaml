    - {q: "客户要求 15 天无理由退货，怎么答复？", docs: [SYN_CORPUS_G_EXCEPTION], facts: ["仅质量原因可退"], answer: "7 至 15 天内仅质量原因可退，非质量问题不支持无理由退货。", topic: 售后政策, role: after_sales, ev: SYN_CORPUS_G_EXCEPTION §二}
    - {q: "客户快递丢件要求赔付，按什么流程处理？", docs: [SYN_CORPUS_G_LOGISTICS], facts: ["3 倍", "100 元", "运单号"], answer: "未保价按运费 3 倍赔付、单票最高 100 元；登记时提供运单号、订单号与货物清单。", topic: 物流时效, role: supply_chain, ev: SYN_CORPUS_G_LOGISTICS §二、§四}
    - {q: "大促期间客户要求改收货地址，怎么处理？", docs: [SYN_CORPUS_G_LONG_OPS], facts: ["转售后通道"], answer: "大促期间不接受指定快递与加急改址，客户特殊要求统一转售后通道处理。", topic: 运营履约, role: operations, ev: SYN_CORPUS_G_LONG_OPS §五}
    - {q: "确认批次异常后召回的处置流程是什么？", docs: [SYN_CORPUS_G_RECALL], facts: ["冻结库存", "通知渠道下架", "回收质检"], answer: "按冻结库存、通知渠道下架、回收质检、复盘四步执行，冻结须在 24 小时内完成。", topic: 质量召回, role: operations, ev: SYN_CORPUS_G_RECALL §一}
    - {q: "客户办理以旧换新的完整流程是什么？", docs: [SYN_CORPUS_P_TRADIN, SYN_CORPUS_G_TRADIN], facts: ["检测", "等级", "折抵"], answer: "先现场检测外观、电池与主板，判定 A/B/C 等级并展示结果，再按对应比例折抵；客户有异议可复检一次。", topic: 以旧换新, role: after_sales, ev: SYN_CORPUS_P_TRADIN §二 + SYN_CORPUS_G_TRADIN}
    - {q: "客户反映积分没到账，怎么排查？", docs: [SYN_CORPUS_G_POINTS], facts: ["确认收货满 7 天", "扣回"], answer: "先核对订单是否确认收货满 7 天，未满则积分未入账属正常；退款订单在退款完成后扣回积分。", topic: 会员积分, role: operations, ev: SYN_CORPUS_G_POINTS §三}
