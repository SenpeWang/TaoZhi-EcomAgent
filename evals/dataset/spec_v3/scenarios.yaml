# V3 RAG 场景参数表：确定性展开为 540 例主集 + 60 例红队。
# 所有 capability/subcategory/track 取自 evals/naming.py；子类英文名即官方术语。
# 生成器按 plans 顺序消费锚点池，track 由每大类固定 30/20/15/10/15 的序列分配，
# 因此改 anchor 内容不会漂移数量口径。

tracks:
  golden: 30
  capability: 20
  regression: 15
  challenge: 10
  heldout: 15

product_types:
  LX20: charger
  LX21: charger
  LX22: charger
  MC500: cable
  C1: membrane
  C5: membrane
  C2: membrane
  SP10: speaker
  QI2_STAND: stand
  MS16: case

aspects:
  - {id: power, types: [charger, cable, speaker, stand], q: "{name} 的标称功率是多少？", field: power, fact: "{value}", answer: "{name} 的标称功率为 {value}。"}
  - {id: ports, types: [charger, cable, speaker, stand, membrane, case], q: "{name} 的接口或适配范围是什么？", field: ports, fact: "{value}", answer: "{name} 的接口或适配范围为 {value}。"}
  - {id: protocol, types: [charger, cable, speaker, stand], q: "{name} 支持哪些协议或规格？", field: protocol, fact: "{value}", answer: "{name} 的协议与规格为 {value}。"}
  - {id: weight, types: [charger, cable, speaker, stand, membrane, case], q: "{name} 的净重是多少？", field: weight, fact: "{value}", answer: "{name} 的净重为 {value}。"}
  - {id: price, types: [charger, cable, speaker, stand, membrane, case], q: "{name} 的官方零售价是多少元？", field: price, fact: "{value} 元", answer: "{name} 的官方零售价为 {value} 元。"}
  - {id: scenario, types: [charger, cable, speaker, stand, membrane, case], q: "{name} 适合哪些使用场景？", field: scenario, fact: "{value}", answer: "{name} 适合的使用场景是{value}。"}

compat_aspects:
  - {id: conclusion, q: "{name} 与 {device} 的兼容性结论是什么？", field: conclusion, fact: "{value}", answer: "{name} 与 {device} 的兼容性结论为「{conclusion}」；{detail}"}
  - {id: detail, q: "{name} 搭配 {device} 时有哪些限制或说明？", field: detail, fact: "{value}", answer: "{name} 搭配 {device} 的说明：{detail}"}

version_kinds:
  - {kind: current, q: "《{title}》目前生效的是哪一版？", docs: ["{new_doc}"], facts: ["{new_version}", "{new_effective}"], answer: "《{title}》目前生效版本为 {new_version}，自 {new_effective} 起执行。", ev: "{new_doc} 生效说明"}
  - {kind: after, q: "{after_date} 签收的订单适用哪一版《{title}》？", docs: ["{new_doc}"], facts: ["{new_version}"], answer: "该订单签收时间晚于 {new_effective}，适用现行版本 {new_version}。", ev: "{new_doc} 生效日期"}
  - {kind: before, q: "{before_date} 签收的订单适用哪一版《{title}》？", docs: ["{old_doc}"], facts: ["{old_version}"], answer: "该订单发生在 {new_effective} 之前，适用当时的版本 {old_version}。", ev: "{old_doc} 生效日期"}
  - {kind: diff, q: "《{title}》{new_version} 相比 {old_version} 有哪些变化？", docs: ["{old_doc}", "{new_doc}"], facts: ["{old_fact}", "{new_fact}"], answer: "{diff}", ev: "{old_doc} 与 {new_doc}"}
  - {kind: conflict, q: "{conflict_q}", docs: ["{old_doc}", "{new_doc}"], facts: ["{new_version}", "以现行有效版本为准"], answer: "{conflict_answer}", ev: "{old_doc} 与 {new_doc} 版本冲突"}

