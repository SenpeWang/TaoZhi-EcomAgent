      C5 陶瓷膜：iPhone 13 至 17、Mate 60 与 70 等直板机均为适配（✔）。
      二、折叠屏适配
      折叠屏内屏：仅 C5 适配；C1/C2 不适配。
  - doc_id: SYN_CORPUS_NOTICE_C5
    title: C5 陶瓷膜上市公告（评测资料）
    body: |
      C5 陶瓷膜上市公告（2026-07-10 发布）
      一、产品定位
      C5 为折叠屏专用全胶陶瓷膜。
      二、FAQ
      问：C5 能贴直板机吗？答：不能。C5 为折叠屏专用，直板机请选择 C1/C2/C3。
      三、渠道口径
      与《机型适配总表》不一致时，以上市公告 FAQ 为准并反馈产品中心核验。
  - doc_id: SYN_CORPUS_TABLE_V4
    title: 机型适配总表 V4.0（评测资料）
    body: |
      机型适配总表 V4.0（2026-10-01 生效）
      一、直板机适配
      1. C1 钢化膜：适配 iPhone 13 至 17 直板机（✔）。
      2. C1 钢化膜：适配 Mate 60、Mate 70 等直板机型（✔）。
      二、曲面屏适配
      1. C1S 曲面版：适配曲面屏机型，覆盖各品牌曲面屏手机。
      2. 曲面屏请选择 C1S，直板机请选择 C1。
      三、生效与冲突
      1. 本表自 2026-10-01 起生效，替代此前版本。
      2. 本表与其他公告不一致时，按最新公告执行。
      3. 本表给出的适配结论仅针对所列机型，未列机型按未标注处理。

  - doc_id: SYN_CORPUS_NOTICE_IP17
    title: iPhone 17 机型适配公告（评测资料）
    body: |
      iPhone 17 机型适配公告（2026-11-05 发布）
      一、机型屏幕变化
      iPhone 17 屏幕为超瓷晶曲面，屏幕边缘存在弧度，与直板机平面屏幕结构不同。
      二、适配结论
      1. 直板通用版 C1 不适配 iPhone 17。
      2. iPhone 17 须选择 C1S 曲面版。
      三、冲突处理
      本公告与《机型适配总表 V4.0》冲突时，以本公告为准。

  - doc_id: SYN_CORPUS_TRADIN_V1
    title: 以旧换新折抵规则 V1.0（评测资料，2025-04-01 生效）
    body: |
      以旧换新折抵规则 V1.0
      生效日期：2025-04-01
      一、折抵比例
      A 级旧机按新机售价 45% 折抵；B 级按 30% 折抵；C 级按 20% 折抵。
      二、折抵上限
      单机折抵金额上限 800 元。
      三、版本说明
      本版本自 2026-09-15 起被 V2.0 替代。
  - doc_id: SYN_CORPUS_TRADIN_V2
    title: 以旧换新折抵规则 V2.0（评测资料，2026-09-15 生效）
    body: |
      以旧换新折抵规则 V2.0
