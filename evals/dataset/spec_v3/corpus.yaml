policies:
  - doc_id: SYN_CORPUS_P_REFUND
    title: 售后退款审批流程（评测制度）
    body: |
      售后退款审批流程
      一、规则内小额退款
      客服在授权范围内可直接处理；金额上限现行制度为草案，具体数值待企业确认。
      二、超限退款
      超限退款按流程逐级上报：客服登记 → 售后组长核定 → 管理层批准。
      三、答复纪律
      不得编造具体金额上限；客户追问时应说明待企业确认。
  - doc_id: SYN_CORPUS_P_PRESALE
    title: 售前客服应答规范（评测制度）
    body: |
      售前客服应答规范
      一、未知问题处置
      知识库未覆盖的客户问题：登记问题并回复客户"帮您确认后答复"，转入组长协调。
      二、答复纪律
      不得现场猜测作答，不得凭个人经验给出确定性答案，不得向客户透露内部流转细节。
  - doc_id: SYN_CORPUS_P_CLASSIFY
    title: 资料密级管理规范（评测制度）
    body: |
      资料密级管理规范
      一、密级定义
      company：全公司可见；org：本部门及下级可见；selected：仅授权对象可见。
      二、发布审核
      组长级及以上资料发布须经审核；密级变更须重新走审批。
      三、权限申请
      需要越级阅读时，按权限申请制度提交审批，不得私下传递。

  - doc_id: SYN_CORPUS_P_INVOICE
    title: 开票与发票管理制度（评测制度）
    body: |
      开票与发票管理制度
      一、发票类型
      1. 可开具电子普通发票（普票）与增值税专用发票（专票）两类，均以电子发票形式交付。
      2. 普票开具给个人或不需要抵扣的主体；专票仅开具给具备一般纳税人资格、能提供完整开票资料的单位客户。
      3. 单笔订单原则上只开具一种发票类型，不拆分专票，也不得先开普票后换开专票。
      二、税率
      1. 货物类商品开具增值税专用发票的税率为 13%。
      2. 电子普通发票税率按商品适用税率执行，货物类同样为 13%。
      3. 运费、安装等单独收费项目按对应税目开票，不得与货物金额混同计税。
      三、开票时限
      1. 客户确认收货后 7 个工作日内完成开具并推送电子发票。
      2. 以客户在订单页面提交开票申请的时点为起算依据，未提交申请的不主动开具。
      3. 大促期间开票量集中，时限仍为确认收货后 7 个工作日内，不得顺延。
      四、红冲期限
      1. 发票开具后 30 日内，客户可申请红冲并重新开具；超过 30 日的红冲申请不予受理。
      2. 红冲须提供原发票号码与红冲原因；原发票已抵扣的，由客户先完成进项转出。
      3. 退货、换货涉及金额变化的，按红冲流程处理，不得直接修改原发票。
      五、答复纪律
      1. 客户咨询税率、开票时限时按本制度答复，不得承诺“随时开票”“先开后补”。
      2. 专票开票资料不全的，一次性告知所需材料，不得反复索取。

  - doc_id: SYN_CORPUS_P_WARRANTY
    title: 保修受理与凭证制度（评测制度）
    body: |
      保修受理与凭证制度
      一、保修期限
      1. 整机保修 18 个月，自客户签收之日起计算。
      2. 配件保修 12 个月，自客户签收之日起计算。
      3. 保修期内更换的部件，其保修期随整机剩余保修期执行，不重新计算。
      二、凭证要求
      1. 申请保修须提供以下凭证之一：订单号、支付记录、设备 SN。
      2. 三种凭证三选一即可，不得以“必须提供全部凭证”为由拒绝受理。
      3. 凭证信息与系统订单记录不一致的，以系统订单记录为准，并登记差异。
      三、不予保修
      1. 人为损坏（跌落、进水）不在免费保修范围，可付费维修。
      2. 私自拆解、擅自改装或经非授权维修点处理的，一律不予免费保修。
      3. 超期（超过保修期限）的，仅提供付费维修服务。
      四、受理时效
      1. 售后收到保修申请后 48 小时内响应，告知受理结论或所需补充材料。
      2. 需要寄修的，48 小时内给出寄修地址与寄送注意事项。
      3. 响应超时的工单须由组长登记原因并跟进，不得静默挂起。
      五、口径说明
      1. 本制度适用于所有渠道销售的整机与配件，渠道另有更优承诺的从其承诺。
      2. 不予保修的情形须书面告知理由，不得仅口头拒绝。

  - doc_id: SYN_CORPUS_P_TRADIN
    title: 以旧换新折抵制度（评测制度）
    body: |
      以旧换新折抵制度
      一、折抵比例
      1. 旧机外观等级 A 级按新机售价 55% 折抵；B 级按 40% 折抵；C 级按 25% 折抵。
      2. 单机折抵金额上限 1000 元，且不得高于新机实付售价的 50%。
      二、检测标准
      1. 外观等级由检测指引判定：A 级无划痕且电池健康度不低于 90%；B 级轻微划痕且电池健康度不低于 80%；C 级屏幕破损或有主板维修史。
      2. 检测结果须现场向客户展示，客户对等级有异议的可发起复检一次。
      三、叠加规则
      1. 折抵金额可与大促让利叠加，但合计优惠不得超过新机售价的 60%。
      2. 折抵金额不得提现，不得转让给他人使用。

  - doc_id: SYN_CORPUS_P_POINTS
    title: 会员积分与权益制度（评测制度）
    body: |
      会员积分与权益制度
      一、积分获取
      1. 实付金额每满 1 元累计 1 积分，退款订单同步扣回对应积分。
      2. 积分在订单确认收货后第 7 天入账，未入账订单不得提前抵扣。
      二、积分使用
      1. 兑换比例固定为 100 积分抵 1 元。
      2. 单笔订单积分抵扣金额不得超过订单金额的 20%。
      3. 积分不可提现、不可转让、不可跨账号合并。
      三、有效期
      1. 积分有效期以最新《会员积分规则》版本为准。
      2. 过期积分自动清零，不另行通知，不补发。

  - doc_id: SYN_CORPUS_P_COMMISSION
    title: 平台佣金与结算制度（评测制度）
    body: |
      平台佣金与结算制度
      一、佣金率
      1. 天猫旗舰店平台佣金率 4.5%。
      2. 抖音小店平台佣金率 3%。
      3. 微信小程序商城平台佣金率 2%。
      二、结算账期
      1. 天猫旗舰店确认收货后 T+7 个自然日结算。
      2. 抖音小店确认收货后 T+15 个自然日结算，且订单无未完结仲裁。
      3. 微信小程序商城 T+3 个工作日结算。
      三、对账要求
      1. 对账异议须在账单出具后 10 个工作日内发起复核。
      2. 佣金以实际支付佣金为准，退款订单按比例退回佣金。

  - doc_id: SYN_CORPUS_P_INSTALL
    title: 安装与上门服务制度（评测制度）
    body: |
      安装与上门服务制度
      一、服务范围
      1. 支架类与桌面充类商品提供上门安装服务，服务费 39 元/单。
      2. 偏远地区（新疆、西藏、青海、宁夏、甘肃）加收上门费 20 元。
      二、时效
      1. 客户预约后 48 小时内上门，超时免收服务费。
      2. 偏远地区上门时效可顺延至 72 小时。
      三、责任
      1. 安装过程中造成商品损坏的，由服务商承担全额赔付。
      2. 客户自带配件导致安装失败的，服务费不予退还。

