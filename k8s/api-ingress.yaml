apiVersion: apps/v1
kind: Deployment
metadata:
  name: taozhi-api
  namespace: ecom-prod
  labels:
    app: taozhi-api
    tier: frontend-gateway
spec:
  replicas: 10
  selector:
    matchLabels:
      app: taozhi-api
  template:
    metadata:
      labels:
        app: taozhi-api
    spec:
      containers:
      - name: api
        image: registry.cn-hangzhou.aliyuncs.com/ecom/taozhi-agent:v3.0.0
        command: ["python", "-m", "uvicorn", "ecom_copilot.enterprise.api:app", "--host", "0.0.0.0", "--port", "18501", "--workers", "4"]
        ports:
        - containerPort: 18501
        resources:
          requests:
            cpu: "1000m"
            memory: "2Gi"
          limits:
            cpu: "4000m"
            memory: "8Gi"
        readinessProbe:
          httpGet:
            path: /api/health
            port: 18501
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: taozhi-api-svc
  namespace: ecom-prod
spec:
  type: ClusterIP
  selector:
    app: taozhi-api
  ports:
  - port: 80
    targetPort: 18501
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: taozhi-ingress
  namespace: ecom-prod
  annotations:
    kubernetes.io/ingress.class: "nginx"
    # Nginx Ingress 网关防刷与高并发连接池优化
    nginx.ingress.kubernetes.io/limit-rps: "200"
    nginx.ingress.kubernetes.io/limit-connections: "500"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "10"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/client-max-body-size: "30m"
spec:
  rules:
  - host: taozhi-api.ecom.internal
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: taozhi-api-svc
            port:
              number: 80
