name: 企业工作台检查
on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'refactor/**', 'docs/**', 'chore/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: ecom_v3_test
          POSTGRES_USER: ecom_v3_test
          POSTGRES_PASSWORD: ci-only-placeholder
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ecom_v3_test -d ecom_v3_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      PYTHONPATH: src
      V3_MODE: test
      V3_TENANT_CODE: mofa
      V3_DATABASE_URL: postgresql://ecom_v3_test@127.0.0.1:5432/ecom_v3_test
      PGPASSWORD: ci-only-placeholder
      APP_ENV: dev
      AUTH_ENABLED: 'false'
      API_KEY: ''
      EMBEDDING_API_KEY: ''
      BUSINESS_API_URL: ''
      BUSINESS_API_TOKEN: ''
    steps:
      - name: 读取源码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: 提交内容与目录检查
        run: python3 scripts/check_repository.py --tracked
      - name: Python 环境
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements.v3.lock.txt
      - name: 安装锁定后端依赖
        run: python -m pip install -r requirements.v3.lock.txt
      - name: Node 环境
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 安装锁定前端依赖
        working-directory: web
        run: npm ci
      - name: 类型检查与前端构建
        working-directory: web
        run: npm run build
      - name: 语法和数据库迁移
        run: |
          python -m compileall -q src scripts migrations tests
          python -m alembic -c alembic.ini upgrade head
      - name: 离线权限与流程回归
        run: python -m pytest tests -m 'not slow' -q --disable-warnings
