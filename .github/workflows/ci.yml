name: 企业工作台检查

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend_and_repo:
    name: 仓检、提交规范与前端构建
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: 读取完整分支历史
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: 公开内容与目录检查
        run: make check-repository
      - name: Node 环境
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 安装锁定前端依赖
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: 提交范围检查
        env:
          CHECK_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CHECK_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$CHECK_BASE" ] || [ "$CHECK_BASE" = "0000000000000000000000000000000000000000" ]; then
            CHECK_BASE="$(git merge-base origin/main "$CHECK_HEAD")"
          fi
          make check-commits COMMIT_BASE="$CHECK_BASE" COMMIT_HEAD="$CHECK_HEAD"
      - name: 前端规范与生产构建
        run: make lint-web check-format build-web

  backend_and_evals:
    name: 后端迁移、回归测试与轨迹回放
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_DB: ecom_test
          POSTGRES_USER: ecom_test
          POSTGRES_PASSWORD: ci-only-placeholder
        ports: ['15432:5432']
        options: >-
          --health-cmd "pg_isready -U ecom_test -d ecom_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      PGPASSWORD: ci-only-placeholder
    steps:
      - name: 读取完整分支历史
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Python 环境
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: 安装锁定后端依赖
        run: python -m pip install -r requirements.lock.txt
      - name: Python 语法检查
        run: make check
      - name: 测试库迁移
        run: make migrate-test
      - name: 离线回归与开发门禁
        run: make test
      - name: Agent 合成轨迹回归
        run: make evals-agent-replay
