name: 企业工作台检查
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: ecom_test
          POSTGRES_USER: ecom_test
          POSTGRES_PASSWORD: ci-only-placeholder
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ecom_test -d ecom_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      PYTHONPATH: src
      ECOM_MODE: test
      ECOM_TENANT_CODE: mofa
      ECOM_DATABASE_URL: postgresql://ecom_test@127.0.0.1:5432/ecom_test
      PGPASSWORD: ci-only-placeholder
      APP_ENV: dev
      AUTH_ENABLED: 'false'
      API_KEY: ''
      EMBEDDING_API_KEY: ''
      BUSINESS_API_URL: ''
      BUSINESS_API_TOKEN: ''
    steps:
      - name: 读取完整分支历史
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: 公开内容与目录检查
        run: python3 scripts/check_repository.py --tracked
      - name: Python 环境
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: 安装锁定后端依赖
        run: python -m pip install -r requirements.lock.txt
      - name: Node 环境
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 安装锁定前端依赖
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: 提交范围检查
        env:
          CHECK_BASE: ${{ github.event.before }}
          CHECK_HEAD: ${{ github.sha }}
        run: |
          if [ -z "$CHECK_BASE" ] || [ "$CHECK_BASE" = "0000000000000000000000000000000000000000" ]; then
            CHECK_BASE="$(git merge-base origin/main "$CHECK_HEAD")"
          fi
          python3 scripts/check_development.py commits --base "$CHECK_BASE" --head "$CHECK_HEAD"
      - name: ESLint、组件命名与 Prettier
        run: |
          make lint-web
          make check-format
      - name: 类型检查与前端构建
        working-directory: web
        run: npm run build
      - name: 语法和数据库迁移
        run: |
          python -m compileall -q src scripts migrations tests
          python -m alembic -c alembic.ini upgrade head
      - name: 离线权限、流程与开发门禁回归
        run: python -m pytest tests -m 'not slow' -q --disable-warnings
